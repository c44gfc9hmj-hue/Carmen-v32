name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-carmen
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v48.1 / v49.2 patches if present
        run: |
          if [ -f patches/apply-v48.1.sh ]; then
            if sh patches/apply-v48.1.sh; then
              echo "v48.1 source patch applied before deploy"
            else
              echo "v48.1 patch already applied or tree mismatch — continuing with current tree"
            fi
          fi
          if [ -f patches/apply-v49.2.sh ]; then
            if sh patches/apply-v49.2.sh; then
              echo "v49.2 source patch applied before deploy"
            else
              echo "v49.2 patch already applied or tree mismatch — continuing with current tree"
            fi
          fi
          if [ -f patches/apply-browser-test.py ]; then
            if python3 patches/apply-browser-test.py; then
              echo "browser-test access surface applied before deploy"
            else
              echo "browser-test patch failed" >&2
              exit 1
            fi
          fi
          if [ -f patches/apply-machine-api.py ]; then
            if python3 patches/apply-machine-api.py; then
              echo "v49.4 machine API applied before deploy"
            else
              echo "machine API patch failed" >&2
              exit 1
            fi
          fi
          if [ -f patches/apply-v49.4-surgical.py ]; then
            if python3 patches/apply-v49.4-surgical.py; then
              echo "v49.4 surgical retrieval fixes applied before tests/deploy"
            else
              echo "v49.4 surgical patch failed" >&2
              exit 1
            fi
          fi
          if [ -f patches/v47.8-video-urls.patch ] && git apply --check patches/v47.8-video-urls.patch; then
            git apply patches/v47.8-video-urls.patch
            echo "applied leftover v47.8 patch"
          else
            echo "v47.8 patch already applied or missing"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests
        run: |
          node test-retrieval.mjs
          node test-search-rank.mjs
          node test-ai-provider.mjs
          node test-v48.1.mjs
          node test-v49.mjs
          node test-v49.1.mjs
          node test-v49.2.mjs
          node test-v49.3.mjs
          node test-v49.4.mjs
          node test-v49.4-machine-api.mjs
          node test-v49.4-identity-anchor.mjs
          node test-v49.4-surgical.mjs
          node test-v49.5.mjs
          node test-v49.6.mjs
          node test-v49.7.mjs
          node test-v49.8.mjs
          node test-v49.9.mjs
          node test-v49.11.mjs
          node test-v49.12.mjs
          node test-v49.13.mjs
          node test-v49.14.mjs
          node test-v50.mjs
          node test-v50-auth.mjs
          node test-browser-test.mjs

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: List Worker secret names (before deploy)
        run: |
          echo "=== secret list (names only) ==="
          npx wrangler secret list --name carmen-iphone-v25 --format json || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure CARMEN_API_KEY (never reuse API_KEY)
        run: |
          set -euo pipefail
          echo "=== Worker secret names (before put) ==="
          npx wrangler secret list --name carmen-iphone-v25 --format json > /tmp/secret-list.raw 2>/tmp/secret-list.err || true
          python3 - <<'PY'
          import json
          raw = open('/tmp/secret-list.raw').read()
          start = raw.find('[')
          raw = raw[start:] if start >= 0 else '[]'
          try:
            data = json.loads(raw)
            names = [x.get('name','') if isinstance(x, dict) else str(x) for x in (data if isinstance(data, list) else [])]
          except Exception:
            names = []
          print('names:', ','.join(names) if names else '(none)')
          open('/tmp/worker-secret-names.txt','w').write('\n'.join(names))
          PY
          HAS_WORKER=0
          if grep -qx 'CARMEN_API_KEY' /tmp/worker-secret-names.txt 2>/dev/null; then HAS_WORKER=1; fi
          if [ -n "${CARMEN_API_KEY:-}" ]; then
            printf '%s' "$CARMEN_API_KEY" | npx wrangler secret put CARMEN_API_KEY --name carmen-iphone-v25
            echo "CARMEN_API_KEY Worker secret updated from GitHub Actions secret (value not logged)."
            echo "CARMEN_KEY_SOURCE=github" >> "$GITHUB_ENV"
            {
              echo 'CARMEN_API_KEY<<CARMEN_EOF'
              printf '%s\n' "$CARMEN_API_KEY"
              echo 'CARMEN_EOF'
            } >> "$GITHUB_ENV"
          elif [ "$HAS_WORKER" = "1" ]; then
            echo "Worker already has CARMEN_API_KEY; GitHub secret is empty. Not rotating."
            echo "CARMEN_KEY_SOURCE=worker-existing" >> "$GITHUB_ENV"
          else
            GEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
            echo "::add-mask::$GEN"
            printf '%s' "$GEN" | npx wrangler secret put CARMEN_API_KEY --name carmen-iphone-v25
            echo "CARMEN_KEY_SOURCE=generated" >> "$GITHUB_ENV"
            {
              echo 'CARMEN_API_KEY<<CARMEN_EOF'
              printf '%s\n' "$GEN"
              echo 'CARMEN_EOF'
            } >> "$GITHUB_ENV"
            echo "Generated CARMEN_API_KEY and put it on the Worker (value masked, not recoverable from logs)."
            echo "To use ChatGPT, set GitHub Actions secret CARMEN_API_KEY to a value you hold, then re-run this workflow."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CARMEN_API_KEY: ${{ secrets.CARMEN_API_KEY }}

      - name: List Worker secret names (after deploy)
        run: |
          echo "=== secret list after deploy (names only) ==="
          npx wrangler secret list --name carmen-iphone-v25 --format json || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production machine-API fixture smoke
        run: |
          set -euo pipefail
          ORIGIN=https://carmen-iphone-v25.94bwfd5grv.workers.dev
          echo "=== unauthenticated POST /api/v1/machine/search must 401 ==="
          CODE=000
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' -X POST \
              -H 'content-type: application/json' \
              -d '{"query":"Drea Morgan","fixture":"drea-intersection"}' \
              "$ORIGIN/api/v1/machine/search" || echo 000)
            echo "attempt $i unauth HTTP $CODE"
            if [ "$CODE" = "401" ]; then break; fi
            sleep 3
          done
          if [ "$CODE" != "401" ]; then
            echo "FAIL: expected 401, got $CODE"
            python3 -c 'print(open("/tmp/unauth.json").read()[:500])' || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/unauth.json"))
          assert d.get("error")=="Unauthorized", d
          s=json.dumps(d)
          assert "token_urlsafe" not in s
          print("unauth 401 body ok, no secret")
          PY
          curl -sS "$ORIGIN/api/v1/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("machineAuthConfigured") is True, d; print("machineAuthConfigured true")'
          if [ -n "${CARMEN_API_KEY:-}" ]; then
            echo "=== authorized fixture smoke (key present in job env, value not printed) ==="
            CARMEN_REQUIRE_AUTH=1 node machine-smoke.mjs --fixture
          else
            echo "Authorized smoke skipped: this job does not hold CARMEN_API_KEY (Worker already had one). Unauth 401 verified."
          fi
        env:
          CARMEN_API_ORIGIN: https://carmen-iphone-v25.94bwfd5grv.workers.dev
          CARMEN_REQUIRE_AUTH: "1"
