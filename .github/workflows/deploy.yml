name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-carmen
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v47.8 video URL patch if needed
        run: |
          if [ -f patches/v47.8-video-urls.patch ] && git apply --check patches/v47.8-video-urls.patch; then
            git apply patches/v47.8-video-urls.patch
            git config user.name "c44gfc9hmj-hue"
            git config user.email "c44gfc9hmj@privaterelay.appleid.com"
            git add worker.js test-search-rank.mjs
            if ! git diff --cached --quiet; then
              git commit -m "Carmen v47.8: keep real video URLs and unused video query classes"
              git push origin HEAD:main || true
              git tag -f v47.8
              git push origin v47.8 --force || true
            fi
          else
            echo "patch already applied or missing"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: List Worker secret names (before deploy)
        run: |
          echo "=== secret list (names only) ==="
          npx wrangler secret list --name carmen-iphone-v25 --format json || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: List Worker secret names (after deploy)
        run: |
          echo "=== secret list after deploy (names only) ==="
          npx wrangler secret list --name carmen-iphone-v25 --format json || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
